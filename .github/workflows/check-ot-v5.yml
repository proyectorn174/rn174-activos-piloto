name: Validar V5 OT geograficas

on:
  push:
    branches: [feature/ot-activo-geografico]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Construir sitio
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wjbuukqqxypclvwwclxe.supabase.co
        run: npm run build
